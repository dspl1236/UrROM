name: Build Windows

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest
      - run: python -m pytest tests/ -v

  build-windows:
    needs: test
    runs-on: windows-latest
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install PyQt5 pyinstaller
      - name: Build exe
        run: python build.py
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: UrROM-windows
          path: dist/*.exe
          retention-days: 7
          if-no-files-found: error

  create-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: UrROM-windows
          path: dist/
      - name: List artifacts
        run: ls -la dist/
      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.exe
          generate_release_notes: true
          body: |
            ## UrROM ${{ github.ref_name }}

            Bosch Motronic M2.3 / M2.3.2 ECU ROM editor for Audi 5-cyl 20v Turbo and V8.

            ### Supported variants
            - **5-cyl M2.3**: 3B, RR (447/857 404 series)
            - **5-cyl M2.3.2**: AAN, ABY, ADU, RS2 (551A/AA/B/C series)
            - **V8 M2.3**: ABH 4.2L, PT 3.6L (557/404V8 series)

            ### What's included
            - Windows .exe — no Python installation required
            - ROM collection (19 reference chips) bundled

            ### Installation
            Download `UrROM-v*.exe` and run directly. No installer needed.
