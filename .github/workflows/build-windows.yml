name: Build Windows

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: windows-latest
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pytest
      - run: python -m pytest tests/ -v

  build-windows:
    needs: test
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt pyinstaller
      - name: Build exe
        run: python build.py
      - name: Rename exe for release
        shell: bash
        run: mv dist/UrROM-v*.exe dist/UrROM.exe
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: UrROM-windows
          path: dist/UrROM.exe
          retention-days: 7
          if-no-files-found: error

      - name: Delete old latest release
        if: github.event_name == 'push'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete latest --yes 2>/dev/null || true
          git push origin :refs/tags/latest 2>/dev/null || true

      - name: Create latest release
        if: github.event_name == 'push'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create latest \
            --title "UrROM — Latest Build" \
            --notes "## UrROM

          Bosch Motronic M2.3 / M2.3.2 ECU ROM editor for Audi 5-cyl 20v Turbo and V8.

          Download UrROM.exe and run — no install needed.

          Commit: ${{ github.sha }}" \
            "dist/UrROM.exe"
