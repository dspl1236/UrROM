name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  QT_QPA_PLATFORM: offscreen
  PYTHONIOENCODING: utf-8

jobs:
  test-linux:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Qt runtime libraries (offscreen platform)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libegl1 libgl1 libxkbcommon-x11-0 libdbus-1-3 libfontconfig1
      - run: pip install -r requirements.txt pytest
      - run: python -m pytest tests/ -v

  test-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pytest
      - run: python -m pytest tests/ -v
